[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "out/" }]

# Mirrors v4-periphery: PositionManager needs via_ir and 500 runs to fit under EIP-170, while the v4 test
# harness only compiles without via_ir. Tests load PositionManager from its artifact (see test/utils/Artifacts.sol).
additional_compiler_profiles = [
  { name = "posm", via_ir = true, optimizer_runs = 500 },
  { name = "test", via_ir = false },
]

compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
  { paths = "test/*.t.sol", via_ir = false },
]

[profile.default.fuzz]
runs = 1_000

[profile.ci.fuzz]
runs = 10_000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# `forge coverage --ir-minimum` compiles everything in a single build, so the per-file restrictions above
# would only split src/ into two artifacts and halve its reported coverage.
[profile.coverage]
additional_compiler_profiles = []
compilation_restrictions = []
